<link rel="manifest" href="./manifest.webmanifest" />
<!-- PNG 兜底：极老的浏览器不认 SVG 图标，Windows 任务栏快捷方式也只取 PNG。
     16/32px 版由 tools/make-favicon.mjs 用 canvas 按目标尺寸重绘，
     不是把 SVG 截图再缩放——非整数缩放下会有半像素模糊。 -->
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png" />
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
<link rel="stylesheet" href="./styles/fonts.css" />
<link rel="stylesheet" href="./styles/base.css" />
<link rel="stylesheet" href="./styles/card.css" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <canvas id="stars"></canvas>
    <div class="nebula nebula--a"></div>
    <div class="nebula nebula--b"></div>
    <div class="aurora"></div>
    <div class="grid-veil"></div>
  </div>

  <div id="fx" class="fx-layer" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="星海鲸语首页">
      <span class="brand__mark" id="brandMark"></span>
      <span class="brand__text">
        <b>星海鲸语</b>
        <i>Whale&nbsp;Oracle&nbsp;Tarot</i>
      </span>
    </a>
    <div class="topbar__actions">
      <button class="icon-btn" id="galleryBtn" type="button" title="浏览全部 78 张牌面">✦<span class="icon-btn__label">牌面</span></button>
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="false" title="环境音效">
        <span class="icon-btn__glyph">♪</span><span class="icon-btn__label">音效</span>
      </button>
      <button class="icon-btn" id="helpBtn" type="button" title="关于牌阵与规则">ⓘ<span class="icon-btn__label">规则</span></button>
    </div>
  </header>

  <main id="app">
    <!-- ─── 步骤 1：方向 ─── -->
    <section class="screen" id="screen-category" data-screen="category">
      <div class="screen__inner">
        <p class="kicker">第一步 · 定心</p>
        <h1 class="title">你想向星海询问什么？</h1>
        <p class="lede">静心三息，选择你要占卜的方向。选定方向后，解读会围绕它展开。</p>
        <div class="cat-grid" id="catGrid" role="list"></div>
        <div class="screen__foot">
          <button class="btn btn--ghost" id="toSpread" type="button" disabled>请先选择一个方向</button>
        </div>
      </div>
    </section>

    <!-- ─── 步骤 2：牌阵 ─── -->
    <section class="screen" id="screen-spread" data-screen="spread" hidden>
      <div class="screen__inner">
        <p class="kicker">第二步 · 立阵</p>
        <h1 class="title">选择牌阵</h1>
        <p class="lede" id="spreadLede">牌阵决定每张牌在哪个位置说话，位置本身就是解读的一部分。</p>
        <div class="spread-grid" id="spreadGrid" role="list"></div>
        <div class="screen__foot">
          <button class="btn btn--ghost" data-back="category" type="button">← 返回</button>
          <button class="btn btn--primary" id="toDraw" type="button">洗牌并抽牌 →</button>
        </div>
      </div>
    </section>

    <!-- ─── 步骤 3：抽牌 ─── -->
    <section class="screen screen--table" id="screen-draw" data-screen="draw" hidden>
      <div class="table-head">
        <div class="table-head__left">
          <p class="kicker">第三步 · 取牌</p>
          <h2 class="title title--sm" id="drawTitle">洗牌中…</h2>
          <p class="lede lede--sm" id="drawHint">深呼吸，把问题放在心里。</p>
        </div>
        <div class="table-head__right">
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
            <div class="progress__bar" id="progressBar"></div>
          </div>
          <span class="progress__label" id="progressLabel">0 / 0</span>
          <button class="btn btn--ghost btn--sm" id="reshuffleBtn" type="button" hidden>↻ 重洗</button>
        </div>
      </div>

      <div class="table-stage" id="tableStage">
        <div class="deck-area" id="deckArea">
          <div class="deck" id="deck" aria-hidden="true"></div>
          <p class="deck-caption" id="deckCaption">星海鲸语 · 78 张</p>
        </div>
        <p class="fan-caption" id="fanCaption" aria-live="polite">凭直觉点选一张牌</p>
        <div class="fan" id="fan"></div>
      </div>

      <div class="table-foot">
        <div class="spread-slots" id="spreadSlots" aria-live="polite"></div>
        <div class="table-foot__actions">
          <button class="btn btn--ghost btn--sm" data-back="spread" type="button">← 换牌阵</button>
          <button class="btn btn--primary" id="flipAllBtn" type="button" hidden>全部翻开 ✦</button>
        </div>
      </div>
    </section>

    <!-- ─── 步骤 4：解读 ─── -->
    <section class="screen screen--reading" id="screen-reading" data-screen="reading" hidden>
      <div class="reading-head">
        <p class="kicker">第四步 · 观象</p>
        <h2 class="title title--sm" id="readingTitle">牌已就位</h2>
        <p class="lede lede--sm" id="readingSub">轻点任意一张牌，翻开它的启示。</p>
      </div>
      <div class="reading-layout" id="readingLayout"></div>
      <div class="reading-foot">
        <button class="btn btn--ghost btn--sm" data-back="draw" type="button">← 回到牌桌</button>
        <button class="btn btn--ghost btn--sm" id="replayBtn" type="button">↻ 同一副牌重看</button>
        <button class="btn btn--ghost btn--sm" id="shareBtn" type="button">⧉ 复制分享链接</button>
        <button class="btn btn--primary" id="againBtn" type="button">开始新的占卜</button>
      </div>
    </section>
  </main>

  <!-- 解读详情浮层 -->
  <div class="modal" id="detailModal" hidden>
    <div class="modal__scrim" data-close="1"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="modal__close" data-close="1" type="button" aria-label="关闭">✕</button>
      <div class="modal__card" id="detailCardArt"></div>
      <div class="modal__body">
        <p class="detail__pos" id="detailPos"></p>
        <h3 class="detail__name" id="detailTitle"></h3>
        <p class="detail__meta" id="detailMeta"></p>
        <div class="detail__nav" id="detailNav">
          <button class="btn btn--ghost btn--sm" id="detailPrev" type="button">← 上一张</button>
          <span class="detail__nav-count" id="detailNavCount"></span>
          <button class="btn btn--ghost btn--sm" id="detailNext" type="button">下一张 →</button>
        </div>
        <div class="detail__section">
          <h4>牌面启示</h4>
          <p id="detailText"></p>
        </div>
        <div class="detail__section" id="detailExtraWrap">
          <h4 id="detailExtraTitle">综合建议</h4>
          <p id="detailExtra"></p>
        </div>
        <div class="detail__tags" id="detailTags"></div>
      </div>
    </div>
  </div>

  <!-- 规则说明 -->
  <div class="modal" id="helpModal" hidden>
    <div class="modal__scrim" data-close="1"></div>
    <div class="modal__panel modal__panel--doc" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <button class="modal__close" data-close="1" type="button" aria-label="关闭">✕</button>
      <h3 class="detail__name" id="helpTitle">占卜规则</h3>
      <div class="doc" id="helpDoc"></div>
    </div>
  </div>

  <!-- 卡面浏览 -->
  <div class="modal" id="galleryModal" hidden>
    <div class="modal__scrim" data-close="1"></div>
    <div class="modal__panel modal__panel--gallery" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
      <button class="modal__close" data-close="1" type="button" aria-label="关闭">✕</button>
      <h3 class="detail__name" id="galleryTitle">牌面图鉴</h3>
      <p class="gallery__lede">全部 78 张牌面。点击任意一张放大查看，可切换查看牌背。</p>
      <div class="gallery__bar">
        <div class="gallery__filters" id="galleryFilters"></div>
        <div class="gallery__tools">
          <button class="btn btn--ghost btn--sm" id="galleryRev" type="button" aria-pressed="false">显示逆位</button>
          <button class="btn btn--ghost btn--sm" id="galleryFlip" type="button" aria-pressed="false">翻到牌背</button>
          <span class="gallery__count" id="galleryCount"></span>
        </div>
      </div>
      <div class="gallery__grid" id="galleryGrid"></div>
    </div>
  </div>

  <!-- 单张放大 -->
  <div class="modal modal--zoom" id="zoomModal" hidden>
    <div class="modal__scrim" data-close="1"></div>
    <div class="modal__zoom" role="dialog" aria-modal="true" aria-labelledby="zoomTitle">
      <button class="modal__close" data-close="1" type="button" aria-label="关闭">✕</button>
      <div class="modal__zoom-art" id="zoomArt"></div>
      <div class="modal__zoom-info">
        <p class="detail__pos" id="zoomPos"></p>
        <h3 class="detail__name" id="zoomTitle"></h3>
        <p class="detail__meta" id="zoomMeta"></p>
        <div class="gallery__nav">
          <button class="btn btn--ghost btn--sm" id="zoomPrev" type="button">← 上一张</button>
          <button class="btn btn--ghost btn--sm" id="zoomNext" type="button">下一张 →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
