<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>插画接入验证</title>
<link rel="stylesheet" href="../styles/fonts.css" />
<style>
  body { margin:0; padding:18px; background:#070a18; color:#cfd6f2; font-family:'Noto Sans SC',system-ui; }
  .row { display:flex; gap:16px; align-items:flex-start; }
  .box { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .box svg { width:300px; height:520px; display:block; border-radius:14px; }
  .box b { font-size:11px; color:#8fa0c8; font-weight:400; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script type="module">
import { DECK } from '../src/data/deck.js';
import { renderCardFront } from '../src/art/card-art.js';
import { mountCardDefs } from '../src/art/whale-back.js';
import { CARD_ART } from '../src/data/art-manifest.js';
mountCardDefs();
const row = document.getElementById('row');
/* 左：已接入插画的牌；右：同一张牌不接插画时的程序化版本（临时改清单再渲染） */
const card = DECK.find((c) => c.id === 'major-00');
const a = document.createElement('div'); a.className = 'box';
a.innerHTML = renderCardFront(card) + `<b>${card.en} · 使用插画底图（CARD_ART 命中）</b>`;
row.appendChild(a);

const b = document.createElement('div'); b.className = 'box';
b.innerHTML = renderCardFront({ ...card, id: 'major-00-proc' }) + `<b>同一张牌 · 程序化 SVG 版本</b>`;
row.appendChild(b);
document.title = 'OK · ' + Object.keys(CARD_ART).length;
</script>
</body>
</html>
