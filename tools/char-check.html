<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>角色放大检视</title>
<link rel="stylesheet" href="../styles/fonts.css" />
<style>
  body { margin:0; padding:20px; background:#070a18; color:#cfd6f2; font-family:'Noto Sans SC',system-ui; }
  h3 { font-size:12px; letter-spacing:.3em; color:#e8c98a; font-weight:400; margin:0 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .box { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .box svg { width:300px; height:520px; display:block; border-radius:14px; }
  .box.sm svg { width:132px; height:229px; }
  .crop svg { width:300px; height:300px; object-fit:cover; }
  .box b { font-size:11px; color:#8fa0c8; font-weight:400; }
  .cropwrap { width:300px; height:300px; overflow:hidden; border-radius:12px; position:relative; }
  .cropwrap svg { position:absolute; top:-140px; left:0; }
</style>
</head>
<body>
<h3>单张大图（300px）</h3>
<div class="row" id="big"></div>
<h3>头部特写</h3>
<div class="row" id="crop"></div>
<h3>实际卡牌尺寸（132px）</h3>
<div class="row" id="small"></div>
<script type="module">
import { DECK } from '../src/data/deck.js';
import { renderCardFront } from '../src/art/card-art.js';
import { mountCardDefs } from '../src/art/whale-back.js';
mountCardDefs();
const pick = ['major-00', 'major-02', 'major-01', 'major-17', 'major-19', 'major-15'];
const big = document.getElementById('big');
const crop = document.getElementById('crop');
const small = document.getElementById('small');
for (const id of pick) {
  const card = DECK.find((c) => c.id === id);
  const svg = renderCardFront(card);
  const b = document.createElement('div'); b.className = 'box';
  b.innerHTML = svg + `<b>${card.name}</b>`; big.appendChild(b);

  const c = document.createElement('div'); c.className = 'box';
  const wrap = document.createElement('div'); wrap.className = 'cropwrap';
  wrap.innerHTML = svg; c.appendChild(wrap);
  const lb = document.createElement('b'); lb.textContent = card.name + ' · 头部';
  c.appendChild(lb); crop.appendChild(c);

  const s = document.createElement('div'); s.className = 'box sm';
  s.innerHTML = svg + `<b>${card.name}</b>`; small.appendChild(s);
}
document.title = 'OK';
</script>
</body>
</html>
